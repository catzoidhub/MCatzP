name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run build
      - run: bun test
      # The release binary for this runner, end to end: on Windows this is the bun --compile binary over a real named
      # pipe on real x64. Bun cannot extract a cross target on the Windows runner, so Bun's baseline build itself compiles
      # there, which gives the same runtime as scripts/release.mjs's bun-windows-x64-baseline target.
      - name: End to end on the compiled binary
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            curl -fsSL -o bun-baseline.zip "https://github.com/oven-sh/bun/releases/download/bun-v$(bun --version)/bun-windows-x64-baseline.zip"
            unzip -q bun-baseline.zip -d bun-baseline
            compiler=bun-baseline/bun-windows-x64-baseline/bun.exe; bin=dist/ci/mcatzp.exe
          else
            compiler=bun; bin=dist/ci/mcatzp
          fi
          "$compiler" build packages/server/src/index.ts --compile --outfile $bin
          test "$($bin --version)" = "$(node -p "require('./packages/server/package.json').version")"
          MCATZP_E2E_CMD=$bin bun test test/e2e.test.ts
